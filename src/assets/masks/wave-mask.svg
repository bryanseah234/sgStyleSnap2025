<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <clipPath id="wave-reveal" clipPathUnits="objectBoundingBox">
      <path class="wave-reveal-shape" d="M 0,0 L 0,0 L 0,1 L 0,1 Z">
        <animate
          attributeName="d"
          from="M 0,0 L 0,0 L 0,1 L 0,1 Z"
          to="M 0,0 L 1,0 L 1,1 L 0,1 Z"
          dur="1.3s"
          fill="freeze"
          calcMode="spline"
          keySplines="0.19 1 0.22 1"
        />
      </path>
    </clipPath>
  </defs>
</svg>
