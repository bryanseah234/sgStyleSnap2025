<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/favicon-16x16.svg" />
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="/favicon-32x32.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Viewport and Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#8b5cf6" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Stylesnap - Your Digital Closet. Organize your clothes, create stunning outfits, and discover your personal style. The ultimate fashion organization app." />
    <meta name="keywords" content="fashion, wardrobe, outfit, style, clothing, organization, digital closet, fashion app, outfit creator, wardrobe organizer" />
    <meta name="author" content="Stylesnap Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://stylesnap.com" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stylesnap.com/" />
    <meta property="og:title" content="Stylesnap - Your Digital Closet" />
    <meta property="og:description" content="Organize your clothes, create stunning outfits, and discover your personal style with Stylesnap." />
    <meta property="og:image" content="https://stylesnap.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Stylesnap" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://stylesnap.com/" />
    <meta name="twitter:title" content="Stylesnap - Your Digital Closet" />
    <meta name="twitter:description" content="Organize your clothes, create stunning outfits, and discover your personal style with Stylesnap." />
    <meta name="twitter:image" content="https://stylesnap.com/twitter-image.jpg" />
    <meta name="twitter:creator" content="@stylesnap" />
    
    <!-- Additional Meta Tags -->
    <meta name="application-name" content="Stylesnap" />
    <meta name="msapplication-TileColor" content="#8b5cf6" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Cache Control -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Google Fonts for Stylesnap Brand Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    
    <title>Stylesnap</title>
    <script>
      // Initialize theme before page loads to prevent flash
      (function() {
        const savedTheme = localStorage.getItem('stylesnap-theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
